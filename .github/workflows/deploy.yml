name: Deploy personal static website of DavidBruchmann

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true # Changed to true to save runner minutes if you push rapid commits

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7 # Note: Use v4 as it is the stable long-term-support version

      - name: Setup Node
        uses: actions/setup-node@v7 # Note: Use v4 as it is the stable long-term-support version
        with:
          node-version: 24 # Note: 22 is the current LTS version; node 24 is experimental
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5 # Note: Use v3 for reliable production bundle matching
        with:
          # 🚨 CRITICAL FIX: Upload the compiled static files, NOT the source root directory
          path: ./build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Note: Step removed. You do not need to checkout code in the deploy job since it pulls the uploaded artifact natively
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5 # Note: Use v4 to match the standard actions matrix stability
