name: Check Fork Updates

on:
  schedule:
    # Runs every day at midnight UTC. You can change this cron expression if needed.
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to trigger this manually from the GitHub Actions UI

permissions:
  issues: write # Needed to automatically create a notification issue
jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Latest Commit from Fork
        id: get_commit
        run: |
          # Fetch the latest commit data from the GitHub API for the fork
          RESPONSE=$(curl -s https://api.github.com/repos/taygoinc/image-size/commits/main)
          SHA=$(echo "$RESPONSE" | jq -r '.sha')
          MESSAGE=$(echo "$RESPONSE" | jq -r '.commit.message')

          # 1. Output the SHA safely (single-line string)
          echo "latest_sha=$SHA" >> $GITHUB_OUTPUT

          # 2. FIX: Output the message safely using an EOF block to handle spaces/slashes
          echo "commit_msg<<EOF" >> $GITHUB_OUTPUT
          echo "$MESSAGE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Check Against Known Secure Commit
        id: compare
        run: |
          # The specific commit hash you are currently using in package.json
          CURRENT_SHA="f7d802d020c795a5ff44bf0581abb5cf75bbac2b"
          LATEST_SHA="${{ steps.get_commit.outputs.latest_sha }}"

          if [ "$CURRENT_SHA" != "$LATEST_SHA" ]; then
            echo "updated=true" >> $GITHUB_OUTPUT
          else
            echo "updated=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Alert Issue if Updated
        if: steps.compare.outputs.updated == 'true'
        uses: imjohnbo/issue-bot@v3
        with:
          assignees: ${{ github.actor }}
          labels: dependency-update, security
          title: "Update Available for taygoinc/image-size"
          body: |
            A new commit has been detected on the `taygoinc/image-size` fork!

            - **Current Commit:** `f7d802d020c795a5ff44bf0581abb5cf75bbac2b`
            - **New Commit:** `${{ steps.get_commit.outputs.latest_sha }}`
            - **Commit Message:** `${{ steps.get_commit.outputs.commit_msg }}`

            To update your project, run:
            ```bash
            npm update image-size
            ```
            Then verify that your build still compiles properly!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  check-issue-bot-v4:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Latest Release of Issue Bot
        id: get_release
        run: |
          # Fetch all releases to find the latest published tag
          # "https://api.github.com/repos/{owner}/{repo}"
          RESPONSE=$(curl -s https://api.github.com/repos/imjohnbo/issue-bot/releases/latest)
          TAG=$(echo "$RESPONSE" | jq -r '.tag_name')

          echo "latest_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Evaluate if Tag is v4
        id: eval_version
        run: |
          TAG_NAME="${{ steps.get_release.outputs.latest_tag }}"

          # Check if the release tag name starts with v4 or 4.
          if [[ "$TAG_NAME" =~ ^v?4\. ]]; then
            echo "is_v4=true" >> $GITHUB_OUTPUT
          else
            echo "is_v4=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Alert Issue if v4 Dropped
        if: steps.eval_version.outputs.is_v4 == 'true'
        uses: imjohnbo/issue-bot@v3
        with:
          assignees: ${{ github.actor }}
          labels: documentation, enhancement
          title: "🚨 issue-bot v4 Has Been Released!"
          body: |
            The `imjohnbo/issue-bot` repository has officially released a new major version: **${{ steps.get_release.outputs.latest_tag }}**!

            Review the breaking changes or new features on their release page before upgrading this workflow file:
            https://github.com
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
